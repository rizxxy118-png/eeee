<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Heart - Ultimate Romantic Vibes</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            /* Background Gradient yang lebih 'deep' dan romantis */
            background: radial-gradient(circle at center, #3d001a 0%, #1a000d 40%, #000 100%); 
        }
        /* Overlay Vignette & Soft Glow */
        body::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
        }
        canvas { display: block; }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, points, textMesh, miniHearts, petals, bokeh;
        let particles = [];
        let time = 0;
        let state = 'INTRO'; 
        const particleCount = 55000;
        const words = ["Cinta", "Sayang", "Selamanya", "I Love You"];
        let currentWordIndex = 0;
        let textTextures = [];

        function createTextTexture(text) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 512; canvas.height = 256;
            ctx.font = "italic bold 80px Georgia";
            ctx.textAlign = "center";
            ctx.shadowBlur = 45; ctx.shadowColor = "#ff00ea";
            ctx.fillStyle = "white";
            ctx.fillText(text, 256, 140);
            return new THREE.CanvasTexture(canvas);
        }

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 75; 

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            // 1. BOKEH LIGHTS (Lampu Taman Romantis)
            bokeh = new THREE.Group();
            const bokehGeo = new THREE.SphereGeometry(0.5, 8, 8);
            for(let i=0; i<60; i++) {
                const mat = new THREE.MeshBasicMaterial({ color: 0xffcc00, transparent: true, opacity: 0.2 });
                const mesh = new THREE.Mesh(bokehGeo, mat);
                mesh.position.set((Math.random()-0.5)*300, (Math.random()-0.5)*200, -50 - Math.random()*100);
                mesh.scale.setScalar(5 + Math.random()*10);
                mesh.userData = { speed: 0.01 + Math.random()*0.02 };
                bokeh.add(mesh);
            }
            scene.add(bokeh);

            // 2. PETALS (Sakura Gugur)
            petals = new THREE.Group();
            for(let i=0; i<100; i++) {
                const mesh = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 0.7), new THREE.MeshBasicMaterial({ color: 0xffb7c5, side: THREE.DoubleSide, transparent: true, opacity: 0.4 }));
                mesh.position.set((Math.random()-0.5)*250, Math.random()*160-80, (Math.random()-0.5)*100);
                mesh.userData = { speedY: 0.04 + Math.random()*0.07, rot: Math.random()*0.02 };
                petals.add(mesh);
            }
            scene.add(petals);

            // 3. MINI HEARTS (Floating)
            miniHearts = new THREE.Group();
            const hShape = new THREE.Shape();
            hShape.moveTo(0, 0); hShape.bezierCurveTo(0, 0.5, 0.5, 1, 1, 1);
            hShape.bezierCurveTo(2, 1, 2, -0.5, 1, -1.5); hShape.lineTo(0, -2.5);
            hShape.lineTo(-1, -1.5); hShape.bezierCurveTo(-2, -0.5, -2, 1, -1, 1);
            const hGeo = new THREE.ShapeGeometry(hShape);
            for(let i=0; i<120; i++) {
                const mat = new THREE.MeshBasicMaterial({ color: 0xff0066, transparent: true, opacity: 0.15 });
                const mesh = new THREE.Mesh(hGeo, mat);
                mesh.position.set((Math.random()-0.5)*260, (Math.random()-0.5)*200, (Math.random()-0.5)*80);
                mesh.scale.setScalar(0.3 + Math.random()*0.4);
                mesh.userData = { speedY: 0.02 + Math.random()*0.04 };
                miniHearts.add(mesh);
            }
            scene.add(miniHearts);

            // 4. MAIN GIANT HEART (Stable Logic)
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            for (let i = 0; i < particleCount; i++) {
                const t = Math.random() * Math.PI * 2;
                const tx = 27 * Math.pow(Math.sin(t), 3);
                const ty = 23 * Math.cos(t) - 9 * Math.cos(2 * t) - 4 * Math.cos(3 * t) - Math.cos(4 * t);
                const tz = (Math.random()-0.5) * 12;
                const offset = 15 + Math.random() * 25;
                const angle = Math.random() * Math.PI * 2;
                positions[i*3] = tx + Math.cos(angle) * offset;
                positions[i*3+1] = ty + Math.sin(angle) * offset;
                positions[i*3+2] = tz;
                const color = new THREE.Color().setHSL(0.92 + (Math.random()*0.08), 1, 0.6);
                colors[i*3] = color.r; colors[i*3+1] = color.g; colors[i*3+2] = color.b;
                particles.push({ tx, ty, tz });
            }
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            points = new THREE.Points(geometry, new THREE.PointsMaterial({ size: 0.22, vertexColors: true, blending: THREE.AdditiveBlending, transparent: true, opacity: 0 }));
            scene.add(points);

            // 5. TEXT
            words.forEach(w => textTextures.push(createTextTexture(w)));
            textMesh = new THREE.Mesh(new THREE.PlaneGeometry(36, 18), new THREE.MeshBasicMaterial({ map: textTextures[0], transparent: true, opacity: 0 }));
            textMesh.position.z = 15;
            scene.add(textMesh);

            setTimeout(() => state = 'IDLE', 8000); 
            setInterval(() => { if (state === 'IDLE') { currentWordIndex = (currentWordIndex + 1) % words.length; textMesh.material.map = textTextures[currentWordIndex]; } }, 5000);
            setTimeout(() => state = 'OUTRO', 65000); 
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            time += 0.012;
            const posAttr = points.geometry.attributes.position;

            // Bokeh floating
            bokeh.children.forEach(b => {
                b.position.y += b.userData.speed;
                b.material.opacity = 0.1 + Math.sin(time + b.position.x) * 0.05;
                if(b.position.y > 100) b.position.y = -100;
            });

            petals.children.forEach(p => {
                p.position.y -= p.userData.speedY; p.rotation.z += 0.01;
                if(p.position.y < -80) p.position.y = 80;
            });

            miniHearts.children.forEach(h => {
                h.position.y += h.userData.speedY;
                if(h.position.y > 100) h.position.y = -100;
            });

            if (state === 'INTRO') {
                if(points.material.opacity < 1) { points.material.opacity += 0.01; textMesh.material.opacity += 0.01; }
            } else if (state === 'OUTRO') {
                points.material.opacity -= 0.01; textMesh.material.opacity -= 0.01;
            }

            for (let i = 0; i < particleCount; i++) {
                let p = particles[i];
                let px = posAttr.getX(i), py = posAttr.getY(i), pz = posAttr.getZ(i);
                if (state === 'INTRO' || state === 'IDLE') {
                    const lerp = state === 'INTRO' ? 0.04 : 0.07;
                    const beat = 1 + Math.sin(time * 1.8) * 0.035;
                    px += (p.tx * beat - px) * lerp;
                    py += (p.ty * beat - py) * lerp;
                    pz += (p.tz - pz) * lerp;
                } else if (state === 'OUTRO') { px *= 1.12; py *= 1.12; pz += 1.2; }
                posAttr.setXYZ(i, px, py, pz);
            }

            posAttr.needsUpdate = true;
            points.rotation.y += 0.0015;
            textMesh.scale.setScalar(1 + Math.sin(time * 1.8) * 0.08);
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        init();
    </script>
</body>
</html>
